[package]
name = "template_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
include = ["/src", "/tests/**/*.rs", "/README.md", "/CHANGELOG.md", "/LICENSE*"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
